services:
  app:
    build: .
    env_file: .env.docker.local
    environment:
      MICROSERVICE_HOST: microservice
      MICROSERVICE_PORT: "3001"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3300}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      microservice:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  microservice:
    build:
      context: .
      dockerfile: src/microservices/Dockerfile
    env_file: .env.docker.local
    environment:
      MICROSERVICE_HOST: "0.0.0.0"
      MICROSERVICE_PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('node:net').connect(3001, '127.0.0.1').on('connect', function () { this.end() }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    command: [./node_modules/.bin/drizzle-kit, migrate]
    env_file: .env.docker.local
    environment:
      MICROSERVICE_HOST: microservice
      MICROSERVICE_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sagelytics
      POSTGRES_USER: sagelytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, sagelytics, -d, sagelytics]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
